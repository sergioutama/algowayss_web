<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% capture title %}{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}{% endcapture %}
  {% assign description = page.description | default: site.description %}
  <title>{{ title | escape }}</title>
  <meta name="description" content="{{ description | escape }}">
  <meta property="og:title" content="{{ title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:image" content="{{ '/assets/images/data-model.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/algoway.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="Algoway insights" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
