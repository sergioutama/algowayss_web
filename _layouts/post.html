---
layout: default
---
<article class="wrap reading">
  <a class="text-link" href="{{ '/blog/' | relative_url }}"><span aria-hidden="true">←</span> All insights</a>
  <p class="eyebrow article-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
  <h1>{{ page.title | escape }}</h1>
  <div class="prose">{{ content }}</div>
</article>
